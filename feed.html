/* -----------------------------------------------
   IN-MEMORY STATE (reset on page reload)
----------------------------------------------- */
const state = {};
POSTS.forEach(p => {
  state[p.id] = {
    like: false, dislike: false, heart: false, hate: false, repost: false,
    commentOpen: false, userComments: []
  };
});

/* -----------------------------------------------
   HELPERS
----------------------------------------------- */
function esc(s) {
  return String(s)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}
function escText(s) {
  return esc(s).replace(/\n/g, '<br>');
}
function fmt(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1).replace('.0', '') + 'M';
  if (n >= 1000) return (n / 1000).toFixed(1).replace('.0', '') + 'K';
  return String(n);
}

/* -----------------------------------------------
   RENDER
----------------------------------------------- */
function renderMedia(p) {
  if (!p.media) return '';
  const { type, src, videoId, thumb, label } = p.media;
  if (type === 'image') {
    return `<div class="post-media">
      <img src="${esc(src)}" alt="Obrázek k příspěvku" loading="lazy">
    </div>`;
  }
  if (type === 'video') {
    return `<div class="post-video-wrap" id="vid-${p.id}" data-vid="${esc(videoId)}">
      <img src="${esc(thumb)}" alt="Náhled videa" loading="lazy">
      <div class="play-btn"><div class="play-arrow"></div></div>
      ${label ? `<div class="video-label">${esc(label)}</div>` : ''}
    </div>`;
  }
  return '';
}

function renderComment(c) {
  return `<div class="comment-item">
    <div class="c-av" style="background:${esc(c.color)}">${esc(c.name.slice(0, 2).toUpperCase())}</div>
    <div>
      <div class="c-name">${esc(c.name)}</div>
      <div class="c-text">${escText(c.text)}</div>
    </div>
  </div>`;
}

function renderPost(p) {
  const s = p.s;
  const badge = p.badge
    ? `<span class="post-badge" title="Ověřený účet">✓</span>` : '';
  return `
  <article class="post" id="post-${p.id}" data-cat="${esc(p.cat)}">
    <div class="post-body">
      <div class="av-wrap">
        <div class="av" style="background:${esc(p.color)}">${esc(p.init)}</div>
      </div>
      <div class="post-content">
        <div class="post-meta">
          <span class="post-name">${esc(p.name)}</span>${badge}
          <span class="post-handle">@${esc(p.handle)}</span>
          <span class="post-sep">·</span>
          <span class="post-time">${esc(p.time)}</span>
          <button class="post-more" title="Více možností">···</button>
        </div>
        <div class="post-text">${escText(p.text)}</div>
        ${renderMedia(p)}
        <div class="post-actions" data-id="${p.id}">
          <button class="act comment" data-action="comment" data-id="${p.id}" title="Komentáře">
            <span class="act-icon">💬</span>
            <span class="act-count" id="cnt-c-${p.id}">${fmt(s.c)}</span>
          </button>
          <button class="act repost" data-action="repost" data-id="${p.id}" title="Repostovat">
            <span class="act-icon">🔁</span>
            <span class="act-count" id="cnt-r-${p.id}">${fmt(s.r)}</span>
          </button>
          <button class="act like" data-action="like" data-id="${p.id}" title="Líbí se mi">
            <span class="act-icon">👍</span>
            <span class="act-count" id="cnt-l-${p.id}">${fmt(s.l)}</span>
          </button>
          <button class="act dislike" data-action="dislike" data-id="${p.id}" title="Nelíbí se mi">
            <span class="act-icon">👎</span>
            <span class="act-count" id="cnt-d-${p.id}">${fmt(s.d)}</span>
          </button>
          <button class="act heart" data-action="heart" data-id="${p.id}" title="Srdíčko">
            <span class="act-icon">❤️</span>
            <span class="act-count" id="cnt-h-${p.id}">${fmt(s.h)}</span>
          </button>
          <button class="act hate" data-action="hate" data-id="${p.id}" title="Nenávidím">
            <span class="act-icon">🤬</span>
            <span class="act-count" id="cnt-x-${p.id}">${fmt(s.x)}</span>
          </button>
        </div>
        <div class="comments-wrap" id="comments-${p.id}">
          <div class="new-comment-row">
            <div class="my-av">Já</div>
            <div class="comment-input-wrap">
              <textarea
                class="comment-input"
                id="cinput-${p.id}"
                placeholder="Přidat komentář..."
                rows="1"
                data-pid="${p.id}"
              ></textarea>
              <button class="comment-send" data-action="send-comment" data-id="${p.id}">Odeslat</button>
            </div>
          </div>
          <div class="comment-list" id="clist-${p.id}">
            ${p.comments.map(renderComment).join('')}
          </div>
        </div>
      </div>
    </div>
  </article>`;
}

/* -----------------------------------------------
   INIT FEED
----------------------------------------------- */
try {
  document.getElementById('feed').innerHTML = POSTS.map(renderPost).join('');
} catch (err) {
  document.getElementById('feed').innerHTML =
    '<div style="padding:30px;color:#dc2626;font-size:14px">Chyba pri renderovani: ' +
    err.message + '</div>';
  console.error('THis render error:', err);
}

/* -----------------------------------------------
   EVENT HANDLING -- delegation on #feed
----------------------------------------------- */
document.getElementById('feed').addEventListener('click', function (e) {
  // Video play
  const videoWrap = e.target.closest('.post-video-wrap');
  if (videoWrap) {
    const vid = videoWrap.dataset.vid;
    if (vid) {
      videoWrap.innerHTML = `<iframe
        src="https://www.youtube.com/embed/${encodeURIComponent(vid)}?autoplay=1"
        allow="autoplay; fullscreen"
        allowfullscreen
      ></iframe>`;
    }
    return;
  }

  // Action buttons
  const btn = e.target.closest('[data-action]');
  if (!btn) return;

  const action = btn.dataset.action;
  const id = parseInt(btn.dataset.id, 10);
  if (!id) return;

  const st = state[id];
  const post = POSTS.find(p => p.id === id);
  if (!st || !post) return;

  if (action === 'comment') {
    st.commentOpen = !st.commentOpen;
    const wrap = document.getElementById('comments-' + id);
    wrap.classList.toggle('open', st.commentOpen);
    btn.classList.toggle('on', st.commentOpen);
    if (st.commentOpen) {
      const inp = document.getElementById('cinput-' + id);
      if (inp) inp.focus();
    }
    return;
  }

  if (action === 'send-comment') {
    const inp = document.getElementById('cinput-' + id);
    const text = (inp ? inp.value : '').trim();
    if (!text) return;

    const clist = document.getElementById('clist-' + id);
    const div = document.createElement('div');
    div.innerHTML = renderComment({ name: 'Já', color: '#94a3b8', text });
    clist.insertBefore(div.firstElementChild, clist.firstChild);
    inp.value = '';
    inp.style.height = 'auto';

    // Update comment count
    post.s.c += 1;
    document.getElementById('cnt-c-' + id).textContent = fmt(post.s.c);
    return;
  }

  // Toggle reactions
  const KEY = { like: 'l', dislike: 'd', heart: 'h', hate: 'x', repost: 'r' };
  const key = KEY[action];
  if (!key) return;

  const wasOn = st[action];
  st[action] = !wasOn;
  btn.classList.toggle('on', st[action]);
  post.s[key] += st[action] ? 1 : -1;
  document.getElementById(`cnt-${key}-${id}`).textContent = fmt(post.s[key]);
});

/* -----------------------------------------------
   TEXTAREA AUTO-RESIZE
----------------------------------------------- */
document.getElementById('feed').addEventListener('input', function (e) {
  if (e.target.classList.contains('comment-input')) {
    const el = e.target;
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 120) + 'px';
  }
});
</script>

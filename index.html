<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>THis – Truth Hunters</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
  <!-- Fredoka One still used for the Go! button -->
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #cbe5f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Georgia', 'Times New Roman', serif;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 20px;
      max-width: 580px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Logo image ── */
    .logo-img {
      width: 100%;
      max-width: 480px;
      display: block;
      margin: 0 auto 20px;
    }

    /* ── Taglines ── */
    .tagline-bold {
      font-size: 21px;
      font-weight: 900;
      color: #1c2e38;
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }
    .tagline-sub {
      font-size: 16px;
      color: #3a5564;
      font-weight: 400;
    }

    /* ── Go! button ── */
    .go-btn {
      display: inline-block;
      margin-top: 36px;
      padding: 15px 68px;
      background: #1c2e38;
      color: #ffffff;
      font-family: 'Fredoka One', cursive;
      font-size: 32px;
      letter-spacing: 2px;
      border-radius: 60px;
      text-decoration: none;
      box-shadow: 0 5px 22px rgba(0,0,0,0.28);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      user-select: none;
    }
    .go-btn:hover {
      transform: translateY(-3px) scale(1.05);
      box-shadow: 0 10px 32px rgba(0,0,0,0.32);
    }
    .go-btn:active {
      transform: translateY(1px) scale(0.97);
      box-shadow: 0 3px 12px rgba(0,0,0,0.22);
    }

    @media (max-width: 460px) {
      .logo-img  { max-width: 320px; }
      .tagline-bold { font-size: 18px; }
      .go-btn    { font-size: 26px; padding: 13px 52px; }
    }
  </style>
</head>
<body>
<div class="container">

  <!-- ══ LOGO IMAGE ══ -->
  <img class="logo-img" src="geezy.png" alt="geezy or cheesy">

  <!-- ══ TAGLINES ══ -->
  <p class="tagline-bold">Where Doge and Pepe hang out.</p>
  <p class="tagline-sub">Rate the vibe. Geezy or Cheesy?</p>

  <!-- ══ GO! BUTTON ══ -->
  <a href="feed.html" class="go-btn">Go!</a>

</div>
</body>
</html>

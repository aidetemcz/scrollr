<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="icons/favicon.jpg">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-MVLPR98SN6"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-MVLPR98SN6');
  </script>
  <title>Truth Hunters</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root { --yellow: #FFE600; }

    body {
      background: var(--yellow);
      min-height: 100vh;
      display: flex;
      align-items: stretch;
      overflow: hidden;
    }

    .side {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    .center {
      width: 530px;
      background: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }

    .logo {
      width: 100%;
      max-width: 133px;
      margin-bottom: 28px;
    }

    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      font-size: 22px;
      color: #222;
      text-align: center;
      line-height: 1.5;
      letter-spacing: 0.01em;
      max-width: 340px;
    }

    .arrow {
      position: absolute;
      transform: translateX(-50%) translateY(0);
      display: block;
      transition: transform 1.8s cubic-bezier(0.45, 0, 0.55, 1);
    }
    .arrow img { display: block; width: auto; }

    @media (max-width: 520px) {
      .side { display: none; }
      .center { width: 100%; }
    }
  </style>
</head>
<body>

<div class="side" id="side-l"></div>

<div class="center">
  <img class="logo" src="icons/scrollr-logo.svg" alt="Scrollr">
  <p class="tagline">Tu nájdete súťažnú úlohu k variante Truth Hunters (Hľadači pravdy).</p>
</div>

<div class="side" id="side-r"></div>

<script>
const OFFSETS = [-80, -80, 0, 0, 0, 80, 80];

function scheduleMove(el) {
  let current = 0;
  function step() {
    const next = OFFSETS[Math.floor(Math.random() * OFFSETS.length)];
    current = next;
    el.style.transform = `translateX(-50%) translateY(${current}px)`;
    setTimeout(step, 1800 + 1000 + Math.random() * 4000);
  }
  setTimeout(step, Math.random() * 6000);
}

function buildSide(container, cols) {
  const seed = container.id === 'side-l' ? 13 : 71;
  let r = seed;
  function rnd() { r = (r * 1664525 + 1013904223) & 0xffffffff; return (r >>> 0) / 0xffffffff; }

  for (let c = 0; c < cols; c++) {
    const x = (c + 0.5) / cols * 100;
    const topPct   = -20 + rnd() * 8;
    const heightVh = Math.round(70 + rnd() * 30);

    const arrow = document.createElement('div');
    arrow.className = 'arrow';
    arrow.style.left = x + '%';
    arrow.style.top  = topPct + '%';

    const img = document.createElement('img');
    img.src = 'https://truth-hunters.cz/icons/arrow.svg';
    img.style.height = heightVh + 'vh';
    img.style.width = 'auto';
    arrow.appendChild(img);
    container.appendChild(arrow);

    scheduleMove(arrow);
  }
}

buildSide(document.getElementById('side-l'), 3);
buildSide(document.getElementById('side-r'), 3);
</script>
</body>
</html>
